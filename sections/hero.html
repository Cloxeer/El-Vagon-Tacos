<section class="og-hero" id="order" data-halite-section="hero">
  <div class="og-hero__media">
    <img
      class="og-hero__image"
      src="images/hero-poster.png"
      alt=""
      data-halite-path='["hero","image"]'
      data-halite-image="true"
    />
    <div class="og-hero__overlay"></div>
  </div>
  <div class="og-hero__content">
    <h1 class="og-hero__headline">
      <span class="og-hero__line" data-halite-path='["hero","headline"]'>Lorem ipsum dolor sit amet</span>
      <span class="og-hero__line og-hero__line--secondary" data-halite-path='["custom","hero","headlineLine2"]'>Lorem ipsum dolor</span>
    </h1>
    <div class="og-hero__ctas">
      <a href="#order" class="og-btn og-btn--cream" data-halite-path='["hero","primaryCta","label"]' data-halite-href='["hero","primaryCta","href"]'>Lorem ipsum</a>
      <a href="/menu" class="og-btn og-btn--cream" data-halite-path='["custom","hero","secondaryCta","label"]' data-halite-href='["custom","hero","secondaryCta","href"]'>See Menu</a>
    </div>
  </div>
</section>
